
<!DOCTYPE html>
<html>
<head>
    <title>Todo App by Kamal Sir</title>

    <style>
        * {
            font-size: 30px;
            text-align: center;
        }
	input[type="text"] {
    		width: 60%;
	}

	button, input[type="submit"], input[type="button"] {
    		cursor: pointer;
	}

	button:disabled, input:disabled {
    		cursor: not-allowed;
    		opacity: 0.6;
	}

	th, td {
    		padding: 8px;
	}

        body {
            background-color: #b0cedf;
        }

        table {
            margin: auto;
            width: 70%;
        }
    </style>
</head>

<body onload="findAll()">
    <h1>Todo App</h1>

    <form onsubmit="save(event)">
        <label>Enter Task</label>
        <br>

        <input type="text"
               id="id_task"
               placeholder="Enter Your Task"
               size="25" />

        <br><br>

        <input type="submit"
               id="id_btn_save"
               value="Save Task" />

        <input type="button"
               id="id_btn_update"
               value="Update Task"
               onclick="updateData()"
               disabled />
    </form>

    <h2 id="id_msg"></h2>

    <br>

    <table border="5">
        <thead>
            <tr>
                <th>Task No.</th>
                <th>Task</th>
                <th>Update</th>
                <th>Delete</th>
            </tr>
        </thead>

        <tbody id="id_info"></tbody>
    </table>

    <script>
        let editId = 0;

        function save(event) {
            event.preventDefault();

            let task = document.getElementById("id_task");
            let btnSave = document.getElementById("id_btn_save");
            let btnUpdate = document.getElementById("id_btn_update");

            if (task.value.trim() === "") {
                alert("Task cannot be empty");
                task.focus();
                return;
            }

            btnSave.disabled = true;

            let data = {
                task: task.value.trim()
            };

            let options = {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            };

            fetch("https://todoapp25oct26-cnh3.onrender.com/save", options)
                .then(res => res.text())
                .then(msg => {
                    alert(msg);

                    task.value = "";
                    task.focus();
                    findAll();
                })
                .catch(err => {
                    alert("Save Issue: " + err);
                })
                .finally(() => {
                    btnSave.disabled = false;
                    btnUpdate.disabled = true;
                });
        }

        function findAll() {
            let info = document.getElementById("id_info");

            fetch("https://todoapp25oct26-cnh3.onrender.com/findAll")
                .then(res => res.json())
                .then(data => {
                    let output = "";

                    for (let i = 0; i < data.length; i++) {
                        output += "<tr>";
                        output += "<td>" + (i + 1) + "</td>";
                        output += "<td>" + data[i].task + "</td>";

                        output += "<td>";
                        output += "<button type='button' onclick='editData("
                            + data[i].id + ")'>Edit</button>";
                        output += "</td>";

                        output += "<td>";
                        output += "<button type='button' onclick='delData("
                            + data[i].id + ")'>Delete</button>";
                        output += "</td>";

                        output += "</tr>";
                    }

                    info.innerHTML = output;
                })
                .catch(err => {
                    console.log("Read Issue: " + err);
                });
        }

        function editData(id) {
            let taskInput = document.getElementById("id_task");
            let btnSave = document.getElementById("id_btn_save");
            let btnUpdate = document.getElementById("id_btn_update");

            fetch("https://todoapp25oct26-cnh3.onrender.com/findAll")
                .then(res => res.json())
                .then(data => {
                    let found = data.find(t => t.id === id);

                    if (found) {
                        editId = id;
                        taskInput.value = found.task;

                        btnSave.disabled = true;
                        btnUpdate.disabled = false;

                        taskInput.focus();
                    }
                })
                .catch(err => {
                    alert("Edit Issue: " + err);
                });
        }

        function updateData() {
            let taskInput = document.getElementById("id_task");
            let btnSave = document.getElementById("id_btn_save");
            let btnUpdate = document.getElementById("id_btn_update");

            if (taskInput.value.trim() === "") {
                alert("Task cannot be empty");
                taskInput.focus();
                return;
            }

            let data = {
                task: taskInput.value.trim()
            };

            let options = {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            };

            fetch("https://todoapp25oct26-cnh3.onrender.com/update/" + editId, options)
                .then(res => res.text())
                .then(msg => {
                    alert(msg);

                    taskInput.value = "";
                    editId = 0;

                    btnSave.disabled = false;
                    btnUpdate.disabled = true;

                    findAll();
                })
                .catch(err => {
                    alert("Update Issue: " + err);
                });
        }

        function delData(id) {
            if (confirm("Are you sure you want to delete this task?")) {
                fetch("https://todoapp25oct26-cnh3.onrender.com/deletebyid/" + id, {
                    method: "DELETE"
                })
                .then(res => res.text())
                .then(msg => {
                    alert(msg);
                    findAll();
                })
                .catch(err => {
                    alert("Delete Issue: " + err);
                });
            }
        }
    </script>
</body>
</html>
